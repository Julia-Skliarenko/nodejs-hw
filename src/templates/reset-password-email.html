<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password</title>
</head>

<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px;">
  <div style="max-width: 600px; margin: 0 auto; background: #ffffff; padding: 20px; border-radius: 8px;">
    <h2>Reset Your Password</h2>
    <p>Hi {{name}},</p>
    <p>You requested to reset your password. Click the button below to proceed:</p>
    <a href="{{resetLink}}"
      style="display: inline-block; padding: 10px 20px; color: #ffffff; background-color: #007bff; text-decoration: none; border-radius: 5px;">Reset
      Password</a>
    <p style="margin-top: 20px; color: #777;">If you didn't request this, please ignore this email.</p>
  </div>
</body>

</html>
